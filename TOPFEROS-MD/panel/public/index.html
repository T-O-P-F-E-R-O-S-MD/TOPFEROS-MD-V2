
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131d">
  <meta name="description" content="TOPFEROS MD V2.0.0 Connection Panel">

  <title>TOPFEROS MD PANEL CONNECTION</title>

  <link rel="stylesheet" href="/style.css">

  <style>
    html {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      scroll-behavior: auto;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      height: auto;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overflow-y: auto;
      background: #07090d;
      -webkit-overflow-scrolling: touch;
    }

    .panel-page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      height: auto;
      isolation: isolate;
      overflow: visible !important;
      padding: 30px 15px 90px !important;
      margin: 0;
      box-sizing: border-box;
    }

    .panel-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background-image: url("/panel-background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .panel-background video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .video-sound-toggle {
      position: absolute;
      right: 15px;
      bottom: 20px;
      z-index: 5;
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 50%;
      background: rgba(10,14,22,.85);
      color: white;
      font-size: 22px;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .connect-card {
      position: relative;
      z-index: 1;
      width: 100%;
      height: auto;
      min-height: 0;
      overflow: visible !important;
      margin: 0 auto 35px !important;
      padding-bottom: 40px !important;
      box-sizing: border-box;
    }

    .connect-screen {
      height: auto;
      min-height: 0;
      overflow: visible;
    }

    .connect-title {
      width: 100%;
      margin: 8px auto;
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.5;
      display: block;
    }

    .connect-footer {
      position: relative;
      margin-top: 25px;
      margin-bottom: 30px !important;
      padding-bottom: 20px;
    }

    #musicToggle {
      touch-action: manipulation;
    }

    @media (max-width: 600px) {
      .panel-page {
        padding: 20px 12px 100px !important;
      }

      .connect-card {
        margin-bottom: 35px !important;
        padding-bottom: 45px !important;
      }
    }
  </style>
</head>

<body>
  <main class="panel-page">

    <div class="panel-background">
      <video
        id="bgVideo"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        poster="/panel-background.png"
      >
        <source src="/panel-background.mp4" type="video/mp4">
      </video>

      <button
        id="videoSoundToggle"
        class="video-sound-toggle"
        type="button"
        aria-label="Aktive son videyo"
      >🔇</button>
    </div>

    <section class="connect-card">

      <img
        class="connect-logo"
        src="/assets/logo.png"
        alt="TOPFEROS MD"
        onerror="this.style.display='none'"
      >

      <h1 class="connect-title">
        🦁 TOPFEROS MD PANEL CONNECTION 🐑
      </h1>

      <p class="connect-subtitle">V2.0.0 · CONNECT PANEL</p>

      <!-- PREMIER ÉCRAN : LANGUE -->
      <section id="languageScreen" class="connect-screen">
        <h2 class="gold">CHWAZI YON LANG🌐</h2>

        <label for="languageSelect">Chwazi lang ou</label>

        <select id="languageSelect" class="connect-field">
          <option value="">-- Chwazi yon lang --</option>
          <option value="ht">🇭🇹 Kreyòl Ayisyen</option>
          <option value="en">🇺🇸 English</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="es">🇪🇸 Español</option>
          <option value="es_do">🇩🇴 Español Dominicano</option>
          <option value="pt">🇵🇹 Português</option>
          <option value="zh">🇨🇳 中文</option>
        </select>

        <button id="continueButton" class="connect-button" type="button">
          KONTINYE ➜
        </button>
      </section>

      <!-- DEZYÈM EKRAN : KÒD PARENAJ -->
      <section id="parrainScreen" class="connect-screen" hidden>
        <h2 id="formTitle" class="gold">🔐 KÒD PARENAJ</h2>

        <p id="instructions">
          Antre nimewo WhatsApp ou ak kòd peyi a.
        </p>

        <form id="parrainForm">
          <input
            id="phoneNumber"
            class="connect-field"
            type="tel"
            inputmode="numeric"
            autocomplete="tel"
            placeholder="Egzanp: 509XXXXXXXX"
            required
          >

          <button id="generateButton" class="connect-button" type="submit">
            🦁 JENERE KÒD LA
          </button>
        </form>

        <div id="codeBox" class="connect-code-box" hidden>
          <div id="parrainCode"></div>

          <button id="copyButton" class="connect-button secondary" type="button">
            📋 KOPYE KÒD LA
          </button>

          <p id="expiration"></p>
        </div>

        <button id="backButton" class="connect-button secondary" type="button">
          ← RETOUNEN CHWAZI LANG
        </button>

        <p id="statusMessage" role="status" aria-live="polite"></p>
      </section>

      <footer class="connect-footer">
        🦁 TECH BY TOPFEROS MD 🐑
      </footer>

    </section>
  </main>

  <script>
    "use strict";

    (() => {
      const $ = (id) => document.getElementById(id);

      const languageScreen = $("languageScreen");
      const parrainScreen = $("parrainScreen");
      const languageSelect = $("languageSelect");
      const phoneInput = $("phoneNumber");
      const form = $("parrainForm");
      const generateButton = $("generateButton");
      const codeBox = $("codeBox");
      const codeElement = $("parrainCode");
      const statusMessage = $("statusMessage");
      const expiration = $("expiration");

      const translations = {
        ht: {
          title: "🔐 KÒD PARENAJ",
          instructions: "Antre nimewo WhatsApp ou ak kòd peyi a.",
          placeholder: "Egzanp: 509XXXXXXXX",
          generate: "🦁 JENERE KÒD LA",
          copy: "📋 KOPYE KÒD LA",
          copied: "✅ Kòd la kopye avèk siksè!",
          copyFailed: "Kopye kòd la manyèlman, tanpri.",
          invalid: "Antre yon nimewo telefòn valab.",
          failed: "Nou pa kapab jenere kòd la. Eseye ankò.",
          back: "← RETOUNEN CHWAZI LANG",
          choose: "Tanpri chwazi yon lang anvan ou kontinye.",
          codeHint: "Antre kòd sa a nan WhatsApp pou konekte aparèy la."
        },
        en: {
          title: "🔐 REFERRAL CODE",
          instructions: "Enter your WhatsApp number with its country code.",
          placeholder: "Example: 15551234567",
          generate: "🦁 GENERATE CODE",
          copy: "📋 COPY CODE",
          copied: "✅ Code copied successfully!",
          copyFailed: "Please copy the code manually.",
          invalid: "Enter a valid phone number.",
          failed: "Could not generate the code. Try again.",
          back: "← BACK TO LANGUAGE",
          choose: "Please choose a language first.",
          codeHint: "Enter this code in WhatsApp to link your device."
        },
        fr: {
          title: "🔐 CODE DE PARRAINAGE",
          instructions: "Entrez votre numéro WhatsApp avec l'indicatif du pays.",
          placeholder: "Exemple : 33612345678",
          generate: "🦁 GÉNÉRER LE CODE",
          copy: "📋 COPIER LE CODE",
          copied: "✅ Code copié avec succès !",
          copyFailed: "Veuillez copier le code manuellement.",
          invalid: "Entrez un numéro de téléphone valide.",
          failed: "Impossible de générer le code. Réessayez.",
          back: "← RETOUR AUX LANGUES",
          choose: "Veuillez d'abord choisir une langue.",
          codeHint: "Entrez ce code dans WhatsApp pour connecter votre appareil."
        },
        es: {
          title: "🔐 CÓDIGO DE REFERIDO",
          instructions: "Introduce tu número de WhatsApp con el código del país.",
          placeholder: "Ejemplo: 34612345678",
          generate: "🦁 GENERAR CÓDIGO",
          copy: "📋 COPIAR CÓDIGO",
          copied: "✅ ¡Código copiado correctamente!",
          copyFailed: "Copia el código manualmente.",
          invalid: "Introduce un número de teléfono válido.",
          failed: "No se pudo generar el código. Inténtalo de nuevo.",
          back: "← VOLVER A IDIOMAS",
          choose: "Selecciona un idioma primero.",
          codeHint: "Introduce este código en WhatsApp para vincular tu dispositivo."
        },
        es_do: {
          title: "🔐 CÓDIGO DE REFERIDO",
          instructions: "Pon tu número de WhatsApp con el código del país.",
          placeholder: "Ejemplo: 18091234567",
          generate: "🦁 GENERAR EL CÓDIGO",
          copy: "📋 COPIAR EL CÓDIGO",
          copied: "✅ ¡Código copiado correctamente!",
          copyFailed: "Copia el código manualmente, por favor.",
          invalid: "Pon un número de teléfono válido.",
          failed: "No se pudo generar el código. Inténtalo otra vez.",
          back: "← VOLVER A ELEGIR IDIOMA",
          choose: "Elige un idioma primero.",
          codeHint: "Pon este código en WhatsApp para vincular tu dispositivo."
        },
        pt: {
          title: "🔐 CÓDIGO DE INDICAÇÃO",
          instructions: "Digite seu número do WhatsApp com o código do país.",
          placeholder: "Exemplo: 5511999999999",
          generate: "🦁 GERAR CÓDIGO",
          copy: "📋 COPIAR CÓDIGO",
          copied: "✅ Código copiado com sucesso!",
          copyFailed: "Copie o código manualmente, por favor.",
          invalid: "Digite um número de telefone válido.",
          failed: "Não foi possível gerar o código. Tente novamente.",
          back: "← VOLTAR AOS IDIOMAS",
          choose: "Escolha um idioma primeiro.",
          codeHint: "Digite este código no WhatsApp para conectar seu dispositivo."
        },
        zh: {
          title: "🔐 推荐码",
          instructions: "请输入包含国家区号的 WhatsApp 电话号码。",
          placeholder: "例如：8613800138000",
          generate: "🦁 生成推荐码",
          copy: "📋 复制推荐码",
          copied: "✅ 推荐码已复制！",
          copyFailed: "请手动复制推荐码。",
          invalid: "请输入有效的电话号码。",
          failed: "无法生成推荐码，请重试。",
          back: "← 返回语言选择",
          choose: "请先选择一种语言。",
          codeHint: "请在 WhatsApp 中输入此代码以连接设备。"
        }
      };

      let selectedLanguage = "ht";
      let currentCode = "";

      function applyLanguage(lang) {
        const t = translations[lang] || translations.ht;

        document.documentElement.lang = lang === "zh" ? "zh" : lang;
        $("formTitle").textContent = t.title;
        $("instructions").textContent = t.instructions;
        phoneInput.placeholder = t.placeholder;
        generateButton.textContent = t.generate;
        $("copyButton").textContent = t.copy;
        $("backButton").textContent = t.back;
      }

      $("continueButton").addEventListener("click", () => {
        const lang = languageSelect.value;

        if (!translations[lang]) {
          alert(translations.ht.choose);
          return;
        }

        selectedLanguage = lang;
        applyLanguage(lang);

        languageScreen.hidden = true;
        parrainScreen.hidden = false;
        statusMessage.textContent = "";
      });

      $("backButton").addEventListener("click", () => {
        parrainScreen.hidden = true;
        languageScreen.hidden = false;
        statusMessage.textContent = "";
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const t = translations[selectedLanguage];
        const number = phoneInput.value.replace(/\D/g, "");

        if (number.length < 8 || number.length > 15) {
          statusMessage.textContent = t.invalid;
          return;
        }

        generateButton.disabled = true;
        codeBox.hidden = true;
        statusMessage.textContent = "";
        currentCode = "";

        try {
          const response = await fetch("/api/pair", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify({
              number,
              language: selectedLanguage
            })
          });

          const result = await response.json().catch(() => null);

          if (
            !response.ok ||
            !result?.success ||
            !result?.pairingCode
          ) {
            throw new Error(result?.message || t.failed);
          }

          currentCode = String(result.pairingCode);
          codeElement.textContent = currentCode;
          codeBox.hidden = false;

          expiration.textContent = t.codeHint;
          statusMessage.textContent = result.message || "";

        } catch (error) {
          statusMessage.textContent = error.message || t.failed;
        } finally {
          generateButton.disabled = false;
        }
      });

      $("copyButton").addEventListener("click", async () => {
        if (!currentCode) return;

        const t = translations[selectedLanguage];

        try {
          await navigator.clipboard.writeText(currentCode);
          statusMessage.textContent = t.copied;
        } catch {
          const temp = document.createElement("textarea");
          temp.value = currentCode;
          temp.style.position = "fixed";
          temp.style.opacity = "0";
          document.body.appendChild(temp);
          temp.select();

          const success = document.execCommand("copy");
          temp.remove();

          statusMessage.textContent = success
            ? t.copied
            : t.copyFailed;
        }
      });
    })();
  </script>

  <!-- TOPFEROS MD PANEL MUSIC -->
  <audio
    id="panelMusic"
    src="/panel-music.mp3"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  ></audio>

  <button
    id="musicToggle"
    type="button"
    aria-label="Activate sound"
    title="Activate sound"
    style="
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 99999;
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 50%;
      background: rgba(10,14,22,.88);
      color: white;
      font-size: 23px;
      cursor: pointer;
    "
  >🔇</button>

  <script>
    (() => {
      const music = document.getElementById("panelMusic");
      const button = document.getElementById("musicToggle");

      if (!music || !button) return;

      music.volume = 0.35;
      music.muted = true;

      function updateIcon() {
        button.textContent = music.muted ? "🔇" : "🔊";
        button.setAttribute(
          "aria-label",
          music.muted ? "Activate sound" : "Mute sound"
        );
        button.title = music.muted ? "Activate sound" : "Mute sound";
      }

      async function startMusic() {
        try {
          await music.play();
        } catch (error) {
          console.log("Autoplay blocked:", error);
        }
      }

      button.addEventListener("click", async () => {
        if (music.paused) {
          await startMusic();
        }

        music.muted = !music.muted;
        updateIcon();
      });

      music.addEventListener("play", updateIcon);
      updateIcon();
      startMusic();
    })();
  </script>

  <!-- BACKGROUND VIDEO SOUND -->
  <script>
    (() => {
      const video = document.getElementById("bgVideo");
      const button = document.getElementById("videoSoundToggle");

      if (!video) return;

      video.muted = true;
      video.playsInline = true;

      video.play().catch(error => {
        console.warn("Background video autoplay:", error);
      });

      if (button) {
        button.addEventListener("click", async () => {
          video.muted = !video.muted;

          if (video.paused) {
            try {
              await video.play();
            } catch (error) {
              console.warn("Video play error:", error);
            }
          }

          button.textContent = video.muted ? "🔇" : "🔊";
        });
      }
    })();
  </script>

</body>
</html>
